name: Bootstrap global TORCIDA+ admin

on:
  push:
    branches:
      - desenvolvimento-seguro
    paths:
      - ".github/bootstrap-admin.trigger"

permissions:
  contents: read

concurrency:
  group: torcida-plus-admin-bootstrap
  cancel-in-progress: false

jobs:
  create-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secret
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Configure o secret RENDER_API_KEY antes de disparar o bootstrap."
            exit 1
          fi

      - name: Start one-off Render job
        id: start
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbklpqrbc2fs739nggfg
        run: |
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/$SERVICE_ID/jobs" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --data '{"startCommand":"python manage.py create_platform_admin --from-env"}')"
          job_id="$(printf '%s' "$response" | jq -r '.id // empty')"
          if [ -z "$job_id" ]; then
            echo "::error::Render não retornou um identificador de job."
            exit 1
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Job privado criado: $job_id"

      - name: Wait for job result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbklpqrbc2fs739nggfg
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          for attempt in $(seq 1 54); do
            response="$(curl --silent --show-error --fail-with-body \
              --url "https://api.render.com/v1/services/$SERVICE_ID/jobs/$JOB_ID" \
              --header "Accept: application/json" \
              --header "Authorization: Bearer $RENDER_API_KEY")"
            status="$(printf '%s' "$response" | jq -r '.status // empty')"
            echo "Estado do job: ${status:-desconhecido}"
            case "$status" in
              succeeded)
                echo "Bootstrap concluído. Remova imediatamente as três variáveis TORCIDA_ADMIN_BOOTSTRAP_* do Render."
                exit 0
                ;;
              failed|canceled)
                echo "::error::O job terminou com status $status. Consulte os logs do job no Render e remova as variáveis de bootstrap após investigar."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Tempo limite aguardando o job. Verifique o Render antes de tentar novamente."
          exit 1
