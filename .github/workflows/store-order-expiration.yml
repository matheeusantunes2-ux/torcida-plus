name: Store order expiration

on:
  schedule:
    # GitHub scheduled workflows use UTC. Offset the quarter-hour to reduce queue congestion.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-order-expiration
  cancel-in-progress: false

jobs:
  expire-orders:
    name: Reconcile expired store orders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: "github-actions-only-not-for-production"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DB_ENGINE: "postgres"
      POSTGRES_HOST: ${{ secrets.TORCIDA_DB_HOST }}
      POSTGRES_PORT: ${{ secrets.TORCIDA_DB_PORT }}
      POSTGRES_DB: ${{ secrets.TORCIDA_DB_NAME }}
      POSTGRES_USER: ${{ secrets.TORCIDA_DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.TORCIDA_DB_PASSWORD }}
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}

    steps:
      - name: Validate required secrets without displaying their values
        shell: bash
        run: |
          missing=0
          for name in POSTGRES_HOST POSTGRES_PORT POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD MERCADO_PAGO_ACCESS_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret ausente: ${name/POSTGRES_HOST/TORCIDA_DB_HOST}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure os secrets de banco externo e Mercado Pago nas configurações do repositório."
            exit 1
          fi

      - name: Checkout application branch
        uses: actions/checkout@v4
        with:
          ref: desenvolvimento-seguro

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database connection and migrations
        run: |
          python manage.py check
          python manage.py migrate --check

      - name: Reconcile payments and release expired reservations
        run: python manage.py expirar_pedidos
