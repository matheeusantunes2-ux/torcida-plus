name: Store checkout CI

on:
  push:
    branches:
      - desenvolvimento-seguro
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/store-checkout-ci.yml"
  pull_request:
    branches:
      - desenvolvimento-seguro
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/store-checkout-ci.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Django store tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run Django checks
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py check
      - name: Check migrations
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py makemigrations --check --dry-run
      - name: Run backend tests
        env:
          DJANGO_DEBUG: "true"
        run: python manage.py test store --verbosity 2

  frontend-build:
    name: React and TypeScript production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        env:
          VITE_API_URL: https://torcida-plus.onrender.com
        run: npm run build
